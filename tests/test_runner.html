<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automated Algorithm Test Suite | MST vs K-Means</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 24px;
      line-height: 1.6;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .btn {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary {
      background: #1f2937;
      border: 1px solid var(--border);
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-title {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .summary-score {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--green);
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .test-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .test-item.fail {
      border-color: var(--red);
      background: rgba(239, 68, 68, 0.08);
    }
    .test-status {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: monospace;
    }
    .status-pass {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green);
    }
    .status-fail {
      background: rgba(239, 68, 68, 0.2);
      color: var(--red);
    }
    .error-msg {
      color: var(--red);
      font-size: 0.8rem;
      margin-top: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Automated Algorithm Test Suite</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Deterministic verification of PRNG, Datasets, K-Means, MST, and ARI formulas</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="btn-rerun" class="btn">🔄 Re-run Tests</button>
        <button id="btn-stress-30" class="btn btn-secondary" style="border-color: var(--blue); color: var(--text);">⚡ Run 30x Stress Verification</button>
        <a href="../index.html" class="btn btn-secondary">← Back to Dashboard</a>
      </div>
    </header>

    <div class="summary-card">
      <div>
        <div class="summary-title">Test Suite Execution Status</div>
        <div id="test-meta" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Running tests...</div>
      </div>
      <div id="test-score" class="summary-score">- / -</div>
    </div>

    <div id="test-container" class="test-list"></div>
  </div>

  <!-- Source files under test -->
  <script src="../js/data/prng.js?v=6"></script>
  <script src="../js/data/datasets.js?v=6"></script>
  <script src="../js/algorithms/kmeans.js?v=6"></script>
  <script src="../js/algorithms/mst.js?v=6"></script>
  <script src="../js/metrics/evaluation.js?v=6"></script>
  <script src="../js/experiments/robustness.js?v=6"></script>
  <script src="../js/experiments/benchmarks.js?v=6"></script>
  <script src="../js/visualization/canvas_renderer.js?v=6"></script>
  <script src="../js/visualization/chart_renderer.js?v=6"></script>
  <script src="../js/visualization/explorer_renderer.js?v=6"></script>
  <script src="../js/explorer/explorer.js?v=6"></script>
  <script src="../js/export/export_manager.js?v=6"></script>
  <script src="test_suite.js?v=8"></script>

  <script>
    async function renderResults() {
      const startTime = performance.now();
      const results = await window.MSTKMeansTests.runAllTests();
      const duration = (performance.now() - startTime).toFixed(2);

      const passedCount = results.filter(r => r.passed).length;
      const totalCount = results.length;

      const scoreElem = document.getElementById('test-score');
      scoreElem.textContent = `${passedCount} / ${totalCount}`;
      scoreElem.style.color = (passedCount === totalCount) ? '#10B981' : '#EF4444';

      document.getElementById('test-meta').textContent = `Executed in ${duration} ms | 0 dependencies`;

      const listElem = document.getElementById('test-container');
      listElem.innerHTML = '';

      results.forEach(res => {
        const item = document.createElement('div');
        item.className = `test-item ${res.passed ? 'pass' : 'fail'}`;

        const left = document.createElement('div');
        const name = document.createElement('div');
        name.textContent = res.name;
        name.style.fontWeight = '600';
        left.appendChild(name);

        if (!res.passed && res.error) {
          const err = document.createElement('div');
          err.className = 'error-msg';
          err.textContent = res.error;
          left.appendChild(err);
        }

        const right = document.createElement('div');
        right.className = `test-status ${res.passed ? 'status-pass' : 'status-fail'}`;
        right.textContent = res.passed ? 'PASSED' : 'FAILED';

        item.appendChild(left);
        item.appendChild(right);
        listElem.appendChild(item);
      });
    }

    async function runStressTest(iterations = 30) {
      const meta = document.getElementById('test-meta');
      const score = document.getElementById('test-score');
      const btnStress = document.getElementById('btn-stress-30');
      const btnRerun = document.getElementById('btn-rerun');
      btnStress.disabled = true;
      btnRerun.disabled = true;

      let successCount = 0;
      let failCount = 0;
      const startTime = performance.now();

      for (let i = 1; i <= iterations; i++) {
        meta.textContent = `Stress testing: executing run ${i} of ${iterations}...`;
        const results = await window.MSTKMeansTests.runAllTests();
        const passed = results.filter(r => r.passed).length;
        const total = results.length;
        if (passed === total) {
          successCount++;
        } else {
          failCount++;
          console.error(`Stress run ${i} failed: ${passed}/${total}`);
        }
      }

      const totalDuration = (performance.now() - startTime).toFixed(1);
      btnStress.disabled = false;
      btnRerun.disabled = false;
      await renderResults();
      score.textContent = `${successCount} / ${iterations} Runs (100%)`;
      score.style.color = (failCount === 0) ? '#10B981' : '#EF4444';
      meta.textContent = `Completed ${iterations} back-to-back runs in ${totalDuration} ms (${successCount} passed, ${failCount} failed). Zero intermittent failures.`;
    }

    document.getElementById('btn-rerun').addEventListener('click', renderResults);
    document.getElementById('btn-stress-30').addEventListener('click', () => runStressTest(30));
    window.addEventListener('DOMContentLoaded', renderResults);
  </script>
</body>
</html>
