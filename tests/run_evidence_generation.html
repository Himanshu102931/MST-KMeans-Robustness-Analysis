<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 6A Automated Evidence Generation Harness</title>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }
    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto 20px auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px; }
    .status-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Phase 6A: Experimental Evidence Generation Harness</h1>
    <p>Executes controlled multi-seed experiments across Gaussian Blobs, Two Moons, and Concentric Circles, profiles runtime benchmarks, and renders high-DPI scientific figures.</p>
    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
      <button id="btn-start" class="btn">▶ Run Evidence Generation</button>
      <button id="btn-download-all" class="btn" style="background: #10b981;" disabled>💾 Download All 13 Artifacts</button>
      <span id="progress-badge" style="align-self: center; font-weight: 600; color: #10b981;">Ready</span>
    </div>
    <div id="log" class="status-box">Awaiting start command...</div>
    <div style="display: none;">
      <textarea id="txt-robustness-trials"></textarea>
      <textarea id="txt-robustness-summary"></textarea>
      <textarea id="txt-benchmark-trials"></textarea>
      <textarea id="txt-benchmark-summary"></textarea>
      <textarea id="txt-config"></textarea>
      <textarea id="txt-env"></textarea>
      <textarea id="txt-blobs-b64"></textarea>
      <textarea id="txt-moons-b64"></textarea>
      <textarea id="txt-circles-b64"></textarea>
      <textarea id="txt-noise-b64"></textarea>
      <textarea id="txt-outliers-b64"></textarea>
      <textarea id="txt-degradation-b64"></textarea>
      <textarea id="txt-scaling-b64"></textarea>
    </div>
  </div>

  <!-- Offscreen Canvases for High-DPI Scientific Renderings -->
  <div id="canvas-container">
    <canvas id="canvas-blobs" width="1200" height="440"></canvas>
    <canvas id="canvas-moons" width="1200" height="440"></canvas>
    <canvas id="canvas-circles" width="1200" height="440"></canvas>
    <canvas id="canvas-noise" width="600" height="420"></canvas>
    <canvas id="canvas-outliers" width="600" height="420"></canvas>
    <canvas id="canvas-degradation" width="600" height="420"></canvas>
    <canvas id="canvas-scaling" width="600" height="420"></canvas>
  </div>

  <!-- Modules under test -->
  <script src="../js/data/prng.js?v=6"></script>
  <script src="../js/data/datasets.js?v=6"></script>
  <script src="../js/algorithms/kmeans.js?v=6"></script>
  <script src="../js/algorithms/mst.js?v=6"></script>
  <script src="../js/metrics/evaluation.js?v=6"></script>
  <script src="../js/experiments/robustness.js?v=6"></script>
  <script src="../js/experiments/benchmarks.js?v=6"></script>
  <script src="../js/visualization/canvas_renderer.js?v=6"></script>
  <script src="../js/visualization/chart_renderer.js?v=6"></script>
  <script src="../js/export/export_manager.js?v=6"></script>

  <script>
    (function () {
      const { PRNG, Datasets, KMeans, MST, Evaluation, Robustness, Benchmarks, Visualizer, ChartRenderer, ExportManager } = window.MSTKMeans;
      const { computeStatistics, runSingleTrial, generateControlledDataset } = Robustness;

      const logElem = document.getElementById('log');
      const badgeElem = document.getElementById('progress-badge');
      const btnStart = document.getElementById('btn-start');

      function log(msg) {
        logElem.textContent += msg + '\n';
        logElem.scrollTop = logElem.scrollHeight;
        console.log(msg);
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      /**
       * Render a composite 3-panel comparison figure:
       * Panel 1: Ground Truth
       * Panel 2: K-Means with Centroids
       * Panel 3: MST with Spanning Tree & Cut Edges
       */
      function renderCompositeComparison(canvas, dataset, kmResult, mstResult, titleText) {
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        // Background
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, H);

        // Header Title
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 18px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(titleText, W / 2, 28);

        const panelW = 370;
        const panelH = 360;
        const panelY = 50;
        const panelXs = [20, 415, 810];

        const kmEval = Evaluation.evaluateClustering(dataset, kmResult.labels);
        const mstEval = Evaluation.evaluateClustering(dataset, mstResult.labels);

        const panels = [
          {
            title: '1. Ground Truth Reference',
            subtitle: `Inliers: ${dataset.inliers.length} | Outliers: ${dataset.outliers.length}`,
            render: (pCtx) => Visualizer.renderGroundTruth(pCtx, dataset)
          },
          {
            title: "2. K-Means (Lloyd + K-Means++)",
            subtitle: `Inlier ARI = ${kmEval.inlierARI.toFixed(4)} | Time = ${kmResult.runtimeMs.toFixed(2)}ms`,
            render: (pCtx) => Visualizer.renderKMeans(pCtx, dataset, kmResult)
          },
          {
            title: "3. MST Clustering (Prim Euclidean)",
            subtitle: `Inlier ARI = ${mstEval.inlierARI.toFixed(4)} | Time = ${mstResult.runtimeMs.toFixed(2)}ms`,
            render: (pCtx) => Visualizer.renderMST(pCtx, dataset, mstResult)
          }
        ];

        for (let i = 0; i < 3; i++) {
          const p = panels[i];
          const px = panelXs[i];

          // Panel background box
          ctx.fillStyle = '#111827';
          ctx.fillRect(px, panelY, panelW, panelH);
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 1;
          ctx.strokeRect(px, panelY, panelW, panelH);

          // Panel header
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 14px system-ui, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(p.title, px + 12, panelY + 24);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillText(p.subtitle, px + 12, panelY + 42);

          // Temporary panel canvas
          const pCanvas = document.createElement('canvas');
          pCanvas.width = panelW - 20;
          pCanvas.height = panelH - 58;
          p.render(pCanvas);

          ctx.drawImage(pCanvas, px + 10, panelY + 48);
        }
      }

      async function runEvidencePipeline() {
        btnStart.disabled = true;
        badgeElem.textContent = 'Executing...';
        badgeElem.style.color = '#f59e0b';
        logElem.textContent = '';
        log('Starting Phase 6A Evidence Generation Pipeline...');

        const startTime = performance.now();

        // -------------------------------------------------------------
        // Protocol Definitions
        // -------------------------------------------------------------
        const datasetFamilies = ['blobs', 'moons', 'circles'];
        const inlierCount = 300;
        const noiseLevels = [0.00, 0.05, 0.10, 0.20];
        const outlierFractions = [0.00, 0.05, 0.10, 0.20];
        const seeds = [11, 22, 33];
        const benchmarkSizes = [100, 200, 400, 600];
        const benchmarkReps = 5;

        log(`Dataset families: ${datasetFamilies.join(', ')}`);
        log(`Inlier sample count: ${inlierCount}`);
        log(`Gaussian noise levels: [${noiseLevels.join(', ')}]`);
        log(`Outlier contamination fractions: [${outlierFractions.map(f => `${f*100}%`).join(', ')}]`);
        log(`Evaluation random seeds: [${seeds.join(', ')}]`);

        // -------------------------------------------------------------
        // Step 1: Execute Robustness Experiments across all geometries
        // -------------------------------------------------------------
        const allRobustnessTrials = [];
        const baselinesMap = new Map(); // key: `${datasetType}_${seed}`

        log('\n--- Step 1: Computing Matched Clean Baselines (noise=0.00, outliers=0.00) ---');
        for (const dType of datasetFamilies) {
          const k = dType === 'blobs' ? 3 : 2;
          for (const seed of seeds) {
            const baseline = runSingleTrial(dType, {
              inlierCount,
              k,
              noise: 0.00,
              outlierFraction: 0.00,
              seed
            });
            baselinesMap.set(`${dType}_${seed}`, baseline);
            log(`Clean baseline: ${dType} (K=${k}, seed=${seed}) -> KM Inlier ARI: ${baseline.kmeans.inlierARI.toFixed(4)}, MST Inlier ARI: ${baseline.mst.inlierARI.toFixed(4)}`);
          }
        }

        log('\n--- Step 2: Executing Noise Sensitivity Sweep (outliers=0.00) ---');
        for (const dType of datasetFamilies) {
          const k = dType === 'blobs' ? 3 : 2;
          for (const noise of noiseLevels) {
            for (const seed of seeds) {
              const baseline = baselinesMap.get(`${dType}_${seed}`);
              let trial;
              if (noise === 0.00) {
                trial = baseline;
              } else {
                trial = runSingleTrial(dType, {
                  inlierCount,
                  k,
                  noise,
                  outlierFraction: 0.00,
                  seed
                });
              }

              const kmDeg = Math.max(0, baseline.kmeans.inlierARI - trial.kmeans.inlierARI);
              const mstDeg = Math.max(0, baseline.mst.inlierARI - trial.mst.inlierARI);

              allRobustnessTrials.push({
                trialId: allRobustnessTrials.length + 1,
                datasetType: dType,
                requestedK: k,
                seed,
                noiseLevel: noise,
                outlierFraction: 0.00,
                outlierCount: trial.outlierCount,
                totalCount: trial.totalCount,
                inlierCount: trial.inlierCount,
                experimentGroup: 'Noise Sensitivity',
                baselineKmInlierARI: baseline.kmeans.inlierARI,
                baselineMstInlierARI: baseline.mst.inlierARI,
                kmInlierARI: trial.kmeans.inlierARI,
                mstInlierARI: trial.mst.inlierARI,
                kmDegradation: kmDeg,
                mstDegradation: mstDeg,
                kmRuntimeMs: trial.kmeans.runtimeMs,
                mstRuntimeMs: trial.mst.runtimeMs,
                kmPredictedK: trial.kmeans.predictedK,
                mstPredictedK: trial.mst.predictedK,
                kmConverged: trial.kmeans.converged,
                kmIterations: trial.kmeans.iterations,
                mstCuts: trial.mst.cutsCount
              });
            }
          }
        }

        log('\n--- Step 3: Executing Outlier Robustness Sweep (noise=0.00) ---');
        for (const dType of datasetFamilies) {
          const k = dType === 'blobs' ? 3 : 2;
          for (const frac of outlierFractions) {
            for (const seed of seeds) {
              const baseline = baselinesMap.get(`${dType}_${seed}`);
              let trial;
              if (frac === 0.00) {
                trial = baseline;
              } else {
                trial = runSingleTrial(dType, {
                  inlierCount,
                  k,
                  noise: 0.00,
                  outlierFraction: frac,
                  seed
                });
              }

              const kmDeg = Math.max(0, baseline.kmeans.inlierARI - trial.kmeans.inlierARI);
              const mstDeg = Math.max(0, baseline.mst.inlierARI - trial.mst.inlierARI);

              allRobustnessTrials.push({
                trialId: allRobustnessTrials.length + 1,
                datasetType: dType,
                requestedK: k,
                seed,
                noiseLevel: 0.00,
                outlierFraction: frac,
                outlierCount: trial.outlierCount,
                totalCount: trial.totalCount,
                inlierCount: trial.inlierCount,
                experimentGroup: 'Outlier Robustness',
                baselineKmInlierARI: baseline.kmeans.inlierARI,
                baselineMstInlierARI: baseline.mst.inlierARI,
                kmInlierARI: trial.kmeans.inlierARI,
                mstInlierARI: trial.mst.inlierARI,
                kmDegradation: kmDeg,
                mstDegradation: mstDeg,
                kmRuntimeMs: trial.kmeans.runtimeMs,
                mstRuntimeMs: trial.mst.runtimeMs,
                kmPredictedK: trial.kmeans.predictedK,
                mstPredictedK: trial.mst.predictedK,
                kmConverged: trial.kmeans.converged,
                kmIterations: trial.kmeans.iterations,
                mstCuts: trial.mst.cutsCount
              });
            }
          }
        }

        log(`Total robustness trials recorded: ${allRobustnessTrials.length} paired runs (${allRobustnessTrials.length * 2} algorithm evaluations).`);

        // -------------------------------------------------------------
        // Step 2: Compute Statistical Summaries for Robustness
        // -------------------------------------------------------------
        log('\n--- Step 4: Computing Robustness Summary Aggregations ---');
        const robustnessSummaryRows = [];

        for (const dType of datasetFamilies) {
          // Noise sweep aggregation
          for (const noise of noiseLevels) {
            const subset = allRobustnessTrials.filter(t => t.datasetType === dType && t.experimentGroup === 'Noise Sensitivity' && Math.abs(t.noiseLevel - noise) < 1e-5);
            const kmARIs = subset.map(t => t.kmInlierARI);
            const mstARIs = subset.map(t => t.mstInlierARI);
            const kmDegs = subset.map(t => t.kmDegradation);
            const mstDegs = subset.map(t => t.mstDegradation);
            const kmRuntimes = subset.map(t => t.kmRuntimeMs);
            const mstRuntimes = subset.map(t => t.mstRuntimeMs);
            const baseKM = subset.map(t => t.baselineKmInlierARI);
            const baseMST = subset.map(t => t.baselineMstInlierARI);

            const kmStats = computeStatistics(kmARIs);
            const mstStats = computeStatistics(mstARIs);
            const kmDegStats = computeStatistics(kmDegs);
            const mstDegStats = computeStatistics(mstDegs);
            const kmRunStats = computeStatistics(kmRuntimes);
            const mstRunStats = computeStatistics(mstRuntimes);
            const baseKMStats = computeStatistics(baseKM);
            const baseMSTStats = computeStatistics(baseMST);

            robustnessSummaryRows.push({
              datasetFamily: dType,
              experimentGroup: 'Noise Sensitivity',
              parameterName: 'Gaussian Noise (sigma)',
              parameterValue: noise.toFixed(2),
              algorithm: 'K-Means',
              sampleCountInliers: inlierCount,
              numSeeds: subset.length,
              baselineInlierARIMean: baseKMStats.mean,
              inlierARIMean: kmStats.mean,
              inlierARIStd: kmStats.std,
              inlierARIMedian: kmStats.median,
              inlierARIMin: kmStats.min,
              inlierARIMax: kmStats.max,
              ariDegradationMean: kmDegStats.mean,
              ariDegradationStd: kmDegStats.std,
              runtimeMsMean: kmRunStats.mean,
              runtimeMsStd: kmRunStats.std
            });

            robustnessSummaryRows.push({
              datasetFamily: dType,
              experimentGroup: 'Noise Sensitivity',
              parameterName: 'Gaussian Noise (sigma)',
              parameterValue: noise.toFixed(2),
              algorithm: 'MST-Clustering',
              sampleCountInliers: inlierCount,
              numSeeds: subset.length,
              baselineInlierARIMean: baseMSTStats.mean,
              inlierARIMean: mstStats.mean,
              inlierARIStd: mstStats.std,
              inlierARIMedian: mstStats.median,
              inlierARIMin: mstStats.min,
              inlierARIMax: mstStats.max,
              ariDegradationMean: mstDegStats.mean,
              ariDegradationStd: mstDegStats.std,
              runtimeMsMean: mstRunStats.mean,
              runtimeMsStd: mstRunStats.std
            });
          }

          // Outlier sweep aggregation
          for (const frac of outlierFractions) {
            const subset = allRobustnessTrials.filter(t => t.datasetType === dType && t.experimentGroup === 'Outlier Robustness' && Math.abs(t.outlierFraction - frac) < 1e-5);
            const kmARIs = subset.map(t => t.kmInlierARI);
            const mstARIs = subset.map(t => t.mstInlierARI);
            const kmDegs = subset.map(t => t.kmDegradation);
            const mstDegs = subset.map(t => t.mstDegradation);
            const kmRuntimes = subset.map(t => t.kmRuntimeMs);
            const mstRuntimes = subset.map(t => t.mstRuntimeMs);
            const baseKM = subset.map(t => t.baselineKmInlierARI);
            const baseMST = subset.map(t => t.baselineMstInlierARI);

            const kmStats = computeStatistics(kmARIs);
            const mstStats = computeStatistics(mstARIs);
            const kmDegStats = computeStatistics(kmDegs);
            const mstDegStats = computeStatistics(mstDegs);
            const kmRunStats = computeStatistics(kmRuntimes);
            const mstRunStats = computeStatistics(mstRuntimes);
            const baseKMStats = computeStatistics(baseKM);
            const baseMSTStats = computeStatistics(baseMST);

            robustnessSummaryRows.push({
              datasetFamily: dType,
              experimentGroup: 'Outlier Robustness',
              parameterName: 'Outlier Fraction',
              parameterValue: `${Math.round(frac * 100)}%`,
              algorithm: 'K-Means',
              sampleCountInliers: inlierCount,
              numSeeds: subset.length,
              baselineInlierARIMean: baseKMStats.mean,
              inlierARIMean: kmStats.mean,
              inlierARIStd: kmStats.std,
              inlierARIMedian: kmStats.median,
              inlierARIMin: kmStats.min,
              inlierARIMax: kmStats.max,
              ariDegradationMean: kmDegStats.mean,
              ariDegradationStd: kmDegStats.std,
              runtimeMsMean: kmRunStats.mean,
              runtimeMsStd: kmRunStats.std
            });

            robustnessSummaryRows.push({
              datasetFamily: dType,
              experimentGroup: 'Outlier Robustness',
              parameterName: 'Outlier Fraction',
              parameterValue: `${Math.round(frac * 100)}%`,
              algorithm: 'MST-Clustering',
              sampleCountInliers: inlierCount,
              numSeeds: subset.length,
              baselineInlierARIMean: baseMSTStats.mean,
              inlierARIMean: mstStats.mean,
              inlierARIStd: mstStats.std,
              inlierARIMedian: mstStats.median,
              inlierARIMin: mstStats.min,
              inlierARIMax: mstStats.max,
              ariDegradationMean: mstDegStats.mean,
              ariDegradationStd: mstDegStats.std,
              runtimeMsMean: mstRunStats.mean,
              runtimeMsStd: mstRunStats.std
            });
          }
        }

        log(`Generated ${robustnessSummaryRows.length} aggregated summary condition records.`);

        // -------------------------------------------------------------
        // Step 3: Run Performance Benchmarks
        // -------------------------------------------------------------
        log('\n--- Step 5: Executing Performance Benchmarks on Gaussian Blobs (K=3) ---');
        const envInfo = Benchmarks.getEnvironmentInfo();
        log(`Environment: ${envInfo.platform} | Logical Cores: ${envInfo.logicalCores} | User Agent: ${envInfo.userAgent}`);

        // Warm-up run
        log('Executing throwaway JIT warm-up pass...');
        const warmupData = Datasets.generateDataset('blobs', { n: 100, k: 3, seed: 999 });
        KMeans.runKMeans(warmupData.points, 3, { seed: 999 });
        MST.runMSTClustering(warmupData.points, 3);
        await sleep(10);

        const benchmarkTrials = [];
        const benchmarkSummaryRows = [];

        for (const n of benchmarkSizes) {
          log(`Profiling Sample Size N = ${n} across ${benchmarkReps} repetitions...`);
          const kmTimes = [];
          const mstTimes = [];

          for (let rep = 0; rep < benchmarkReps; rep++) {
            const repSeed = 1000 + rep * 17;
            const ds = Datasets.generateDataset('blobs', {
              n,
              k: 3,
              noise: 0.05,
              outlierFraction: 0.0,
              seed: repSeed
            });

            // Timed K-Means execution
            const t0KM = performance.now();
            const kmRes = KMeans.runKMeans(ds.points, 3, { seed: repSeed });
            const t1KM = performance.now();
            const kmDuration = Math.max(0, t1KM - t0KM);
            kmTimes.push(kmDuration);

            benchmarkTrials.push({
              sampleSize: n,
              algorithm: 'K-Means',
              repetitionIndex: rep + 1,
              runtimeMs: kmDuration,
              k: 3,
              noiseLevel: 0.05,
              datasetFamily: 'blobs',
              hardwareCores: envInfo.logicalCores,
              userAgent: envInfo.userAgent
            });

            // Timed MST execution
            const t0MST = performance.now();
            const mstRes = MST.runMSTClustering(ds.points, 3);
            const t1MST = performance.now();
            const mstDuration = Math.max(0, t1MST - t0MST);
            mstTimes.push(mstDuration);

            benchmarkTrials.push({
              sampleSize: n,
              algorithm: 'MST Prim Dense',
              repetitionIndex: rep + 1,
              runtimeMs: mstDuration,
              k: 3,
              noiseLevel: 0.05,
              datasetFamily: 'blobs',
              hardwareCores: envInfo.logicalCores,
              userAgent: envInfo.userAgent
            });

            await sleep(5);
          }

          const kmStats = computeStatistics(kmTimes);
          const mstStats = computeStatistics(mstTimes);
          const speedupRatio = kmStats.median > 0 ? (mstStats.median / kmStats.median) : 1.0;

          log(`  N=${n}: K-Means mean=${kmStats.mean.toFixed(2)}ms, MST mean=${mstStats.mean.toFixed(2)}ms (Speedup: ${speedupRatio.toFixed(2)}x)`);

          benchmarkSummaryRows.push({
            sampleSize: n,
            algorithm: 'K-Means',
            repetitions: benchmarkReps,
            runtimeMeanMs: kmStats.mean,
            runtimeMedianMs: kmStats.median,
            runtimeStdMs: kmStats.std,
            runtimeMinMs: kmStats.min,
            runtimeMaxMs: kmStats.max,
            relativeRatioVsMST: speedupRatio,
            logicalCores: envInfo.logicalCores,
            browserPlatform: envInfo.platform
          });

          benchmarkSummaryRows.push({
            sampleSize: n,
            algorithm: 'MST Prim Dense',
            repetitions: benchmarkReps,
            runtimeMeanMs: mstStats.mean,
            runtimeMedianMs: mstStats.median,
            runtimeStdMs: mstStats.std,
            runtimeMinMs: mstStats.min,
            runtimeMaxMs: mstStats.max,
            relativeRatioVsMST: 1.00,
            logicalCores: envInfo.logicalCores,
            browserPlatform: envInfo.platform
          });
        }

        // -------------------------------------------------------------
        // Step 4: Render High-DPI Scientific Figures
        // -------------------------------------------------------------
        log('\n--- Step 6: Rendering High-DPI Figures onto Canvas ---');

        // Figure 1: Blobs Comparison (N=300 inliers, 15 outliers, noise=0.05, seed=11)
        const blobsCanvas = document.getElementById('canvas-blobs');
        const blobsDS = generateControlledDataset('blobs', { inlierCount: 300, k: 3, noise: 0.05, outlierFraction: 0.05, seed: 11 });
        const blobsKM = KMeans.runKMeans(blobsDS.points, 3, { seed: 11 });
        const blobsMST = MST.runMSTClustering(blobsDS.points, 3);
        renderCompositeComparison(blobsCanvas, blobsDS, blobsKM, blobsMST, 'Gaussian Blobs (K=3) — Ground Truth vs K-Means vs MST Prim');
        const blobsPNGData = blobsCanvas.toDataURL('image/png');
        log('Rendered blobs_comparison.png');

        // Figure 2: Two Moons Comparison (N=300 inliers, 15 outliers, noise=0.05, seed=11)
        const moonsCanvas = document.getElementById('canvas-moons');
        const moonsDS = generateControlledDataset('moons', { inlierCount: 300, k: 2, noise: 0.05, outlierFraction: 0.05, seed: 11 });
        const moonsKM = KMeans.runKMeans(moonsDS.points, 2, { seed: 11 });
        const moonsMST = MST.runMSTClustering(moonsDS.points, 2);
        renderCompositeComparison(moonsCanvas, moonsDS, moonsKM, moonsMST, 'Two Moons (K=2) — Ground Truth vs K-Means vs MST Prim');
        const moonsPNGData = moonsCanvas.toDataURL('image/png');
        log('Rendered moons_comparison.png');

        // Figure 3: Concentric Circles Comparison (N=300 inliers, 15 outliers, noise=0.05, seed=11)
        const circlesCanvas = document.getElementById('canvas-circles');
        const circlesDS = generateControlledDataset('circles', { inlierCount: 300, k: 2, noise: 0.05, outlierFraction: 0.05, seed: 11 });
        const circlesKM = KMeans.runKMeans(circlesDS.points, 2, { seed: 11 });
        const circlesMST = MST.runMSTClustering(circlesDS.points, 2);
        renderCompositeComparison(circlesCanvas, circlesDS, circlesKM, circlesMST, 'Concentric Circles (K=2) — Ground Truth vs K-Means vs MST Prim');
        const circlesPNGData = circlesCanvas.toDataURL('image/png');
        log('Rendered circles_comparison.png');

        // Figure 4: Inlier ARI vs Noise Level (Two Moons)
        const noiseCanvas = document.getElementById('canvas-noise');
        const moonsNoiseSummary = robustnessSummaryRows.filter(r => r.datasetFamily === 'moons' && r.experimentGroup === 'Noise Sensitivity');
        const noiseTicks = ['\u03C3=0.00', '\u03C3=0.05', '\u03C3=0.10', '\u03C3=0.20'];
        const kmNoiseData = moonsNoiseSummary.filter(r => r.algorithm === 'K-Means').map(r => ({ mean: r.inlierARIMean, std: r.inlierARIStd }));
        const mstNoiseData = moonsNoiseSummary.filter(r => r.algorithm === 'MST-Clustering').map(r => ({ mean: r.inlierARIMean, std: r.inlierARIStd }));
        ChartRenderer.renderLineChartWithErrorBars(noiseCanvas, {
          title: 'Two Moons: Inlier ARI vs Noise Level (\u03C3)',
          xLabel: 'Gaussian Noise Level (\u03C3)',
          yLabel: 'Inlier ARI',
          xTicks: noiseTicks,
          kmData: kmNoiseData,
          mstData: mstNoiseData,
          yMin: -0.2,
          yMax: 1.05
        });
        const noisePNGData = noiseCanvas.toDataURL('image/png');
        log('Rendered ari_vs_noise.png');

        // Figure 5: Inlier ARI vs Outliers (Gaussian Blobs)
        const outliersCanvas = document.getElementById('canvas-outliers');
        const blobsOutliersSummary = robustnessSummaryRows.filter(r => r.datasetFamily === 'blobs' && r.experimentGroup === 'Outlier Robustness');
        const outlierTicks = ['0%', '5%', '10%', '20%'];
        const kmOutlierData = blobsOutliersSummary.filter(r => r.algorithm === 'K-Means').map(r => ({ mean: r.inlierARIMean, std: r.inlierARIStd }));
        const mstOutlierData = blobsOutliersSummary.filter(r => r.algorithm === 'MST-Clustering').map(r => ({ mean: r.inlierARIMean, std: r.inlierARIStd }));
        ChartRenderer.renderLineChartWithErrorBars(outliersCanvas, {
          title: 'Gaussian Blobs: Inlier ARI vs Outlier Contamination',
          xLabel: 'Outlier Fraction (% of inliers)',
          yLabel: 'Inlier ARI',
          xTicks: outlierTicks,
          kmData: kmOutlierData,
          mstData: mstOutlierData,
          yMin: 0.0,
          yMax: 1.05
        });
        const outliersPNGData = outliersCanvas.toDataURL('image/png');
        log('Rendered ari_vs_outliers.png');

        // Figure 6: Matched Baseline Degradation (All geometries comparison)
        const degradationCanvas = document.getElementById('canvas-degradation');
        const degSteps = [];
        const degKM = [];
        const degMST = [];

        // Pick representative degradation steps across geometries
        datasetFamilies.forEach(df => {
          const n20 = robustnessSummaryRows.find(r => r.datasetFamily === df && r.experimentGroup === 'Noise Sensitivity' && r.parameterValue === '0.20' && r.algorithm === 'K-Means');
          const n20m = robustnessSummaryRows.find(r => r.datasetFamily === df && r.experimentGroup === 'Noise Sensitivity' && r.parameterValue === '0.20' && r.algorithm === 'MST-Clustering');
          const o20 = robustnessSummaryRows.find(r => r.datasetFamily === df && r.experimentGroup === 'Outlier Robustness' && r.parameterValue === '20%' && r.algorithm === 'K-Means');
          const o20m = robustnessSummaryRows.find(r => r.datasetFamily === df && r.experimentGroup === 'Outlier Robustness' && r.parameterValue === '20%' && r.algorithm === 'MST-Clustering');

          if (n20 && n20m) {
            degSteps.push(`${df.substring(0, 4)}: \u03C3=0.20`);
            degKM.push(n20.ariDegradationMean);
            degMST.push(n20m.ariDegradationMean);
          }
          if (o20 && o20m) {
            degSteps.push(`${df.substring(0, 4)}: 20% Out`);
            degKM.push(o20.ariDegradationMean);
            degMST.push(o20m.ariDegradationMean);
          }
        });

        ChartRenderer.renderDegradationBarChart(degradationCanvas, {
          title: 'Matched Baseline Degradation (\u0394ARI Loss)',
          xTicks: degSteps,
          kmDegradation: degKM,
          mstDegradation: degMST
        });
        const degradationPNGData = degradationCanvas.toDataURL('image/png');
        log('Rendered ari_degradation.png');

        // Figure 7: Runtime Scaling
        const scalingCanvas = document.getElementById('canvas-scaling');
        const bmSizes = [100, 200, 400, 600];
        const kmScaleData = bmSizes.map(sz => {
          const r = benchmarkSummaryRows.find(b => b.sampleSize === sz && b.algorithm === 'K-Means');
          return { mean: r.runtimeMeanMs, std: r.runtimeStdMs };
        });
        const mstScaleData = bmSizes.map(sz => {
          const r = benchmarkSummaryRows.find(b => b.sampleSize === sz && b.algorithm === 'MST Prim Dense');
          return { mean: r.runtimeMeanMs, std: r.runtimeStdMs };
        });

        ChartRenderer.renderRuntimeScalingChart(scalingCanvas, {
          title: 'Empirical Runtime Scaling vs Sample Size N (Blobs K=3)',
          sampleSizes: bmSizes,
          kmTimes: kmScaleData,
          mstTimes: mstScaleData
        });
        const scalingPNGData = scalingCanvas.toDataURL('image/png');
        log('Rendered runtime_scaling.png');

        // -------------------------------------------------------------
        // Step 5: Format CSV and JSON outputs
        // -------------------------------------------------------------
        log('\n--- Step 7: Formatting RFC 4180 CSVs & JSON Configs ---');

        // 1. robustness_trials.csv
        const rawHeaders = [
          'trial_id',
          'dataset_family',
          'inlier_sample_count',
          'outlier_count',
          'total_sample_count',
          'requested_k',
          'random_seed',
          'gaussian_noise_level',
          'outlier_fraction',
          'experiment_group',
          'algorithm',
          'inlier_ari',
          'matched_baseline_inlier_ari',
          'ari_degradation',
          'clustering_runtime_ms',
          'predicted_k'
        ];
        const rawRows = [];
        allRobustnessTrials.forEach(t => {
          // K-Means row
          rawRows.push([
            t.trialId,
            t.datasetType,
            t.inlierCount,
            t.outlierCount,
            t.totalCount,
            t.requestedK,
            t.seed,
            t.noiseLevel.toFixed(4),
            t.outlierFraction.toFixed(4),
            t.experimentGroup,
            'K-Means',
            t.kmInlierARI.toFixed(6),
            t.baselineKmInlierARI.toFixed(6),
            t.kmDegradation.toFixed(6),
            t.kmRuntimeMs.toFixed(3),
            t.kmPredictedK
          ]);

          // MST row
          rawRows.push([
            t.trialId,
            t.datasetType,
            t.inlierCount,
            t.outlierCount,
            t.totalCount,
            t.requestedK,
            t.seed,
            t.noiseLevel.toFixed(4),
            t.outlierFraction.toFixed(4),
            t.experimentGroup,
            'MST-Clustering',
            t.mstInlierARI.toFixed(6),
            t.baselineMstInlierARI.toFixed(6),
            t.mstDegradation.toFixed(6),
            t.mstRuntimeMs.toFixed(3),
            t.mstPredictedK
          ]);
        });
        const robustnessTrialsCSV = ExportManager.toCSV(rawHeaders, rawRows);

        // 2. robustness_summary.csv
        const summaryHeaders = [
          'dataset_family',
          'experiment_group',
          'parameter_name',
          'parameter_value',
          'algorithm',
          'sample_count_inliers',
          'num_seeds',
          'baseline_inlier_ari_mean',
          'inlier_ari_mean',
          'inlier_ari_std',
          'inlier_ari_median',
          'inlier_ari_min',
          'inlier_ari_max',
          'ari_degradation_mean',
          'ari_degradation_std',
          'runtime_ms_mean',
          'runtime_ms_std'
        ];
        const summaryRows = robustnessSummaryRows.map(s => [
          s.datasetFamily,
          s.experimentGroup,
          s.parameterName,
          s.parameterValue,
          s.algorithm,
          s.sampleCountInliers,
          s.numSeeds,
          s.baselineInlierARIMean.toFixed(6),
          s.inlierARIMean.toFixed(6),
          s.inlierARIStd.toFixed(6),
          s.inlierARIMedian.toFixed(6),
          s.inlierARIMin.toFixed(6),
          s.inlierARIMax.toFixed(6),
          s.ariDegradationMean.toFixed(6),
          s.ariDegradationStd.toFixed(6),
          s.runtimeMsMean.toFixed(3),
          s.runtimeMsStd.toFixed(3)
        ]);
        const robustnessSummaryCSV = ExportManager.toCSV(summaryHeaders, summaryRows);

        // 3. benchmark_trials.csv
        const bmTrialHeaders = [
          'sample_size_n',
          'algorithm',
          'repetition_index',
          'runtime_ms',
          'k',
          'noise_level',
          'dataset_family',
          'hardware_cores',
          'user_agent'
        ];
        const bmTrialRows = benchmarkTrials.map(t => [
          t.sampleSize,
          t.algorithm,
          t.repetitionIndex,
          t.runtimeMs.toFixed(4),
          t.k,
          t.noiseLevel.toFixed(2),
          t.datasetFamily,
          t.hardwareCores,
          t.userAgent
        ]);
        const benchmarkTrialsCSV = ExportManager.toCSV(bmTrialHeaders, bmTrialRows);

        // 4. benchmark_summary.csv
        const bmSummaryHeaders = [
          'sample_size_n',
          'algorithm',
          'repetitions',
          'runtime_mean_ms',
          'runtime_median_ms',
          'runtime_std_ms',
          'runtime_min_ms',
          'runtime_max_ms',
          'speedup_ratio_vs_mst',
          'hardware_logical_cores',
          'browser_platform'
        ];
        const bmSummaryRows = benchmarkSummaryRows.map(s => [
          s.sampleSize,
          s.algorithm,
          s.repetitions,
          s.runtimeMeanMs.toFixed(4),
          s.runtimeMedianMs.toFixed(4),
          s.runtimeStdMs.toFixed(4),
          s.runtimeMinMs.toFixed(4),
          s.runtimeMaxMs.toFixed(4),
          s.relativeRatioVsMST.toFixed(2),
          s.logicalCores,
          s.browserPlatform
        ]);
        const benchmarkSummaryCSV = ExportManager.toCSV(bmSummaryHeaders, bmSummaryRows);

        // 5. experiment_config.json
        const experimentConfigJSON = JSON.stringify({
          project: {
            title: "MST vs K-Means Robustness Analysis",
            leadStudent: "Himanshu Gupta",
            allocationNumber: 19,
            projectPartner: "Parth Yadav",
            institution: "Manav Rachna International Institute of Research and Studies",
            course: "Pattern Matching Lab (BCS-DS-777)",
            checkpoint: "caca5cd",
            branch: "main"
          },
          experimentalProtocol: {
            datasetFamilies: [
              { name: "Gaussian Blobs", k: 3, inliers: 300, geometry: "Convex / Isotropic Hyper-Spherical" },
              { name: "Two Moons", k: 2, inliers: 300, geometry: "Non-Linear Interlocking Manifolds" },
              { name: "Concentric Circles", k: 2, inliers: 300, geometry: "Non-Linear Concentric Rings" }
            ],
            controlledPerturbations: {
              noiseSensitivity: {
                parameter: "gaussian_noise_sigma",
                levels: [0.00, 0.05, 0.10, 0.20],
                fixedOutlierFraction: 0.00
              },
              outlierRobustness: {
                parameter: "outlier_fraction",
                levels: [0.00, 0.05, 0.10, 0.20],
                absoluteOutlierCounts: [0, 15, 30, 60],
                fixedGaussianNoise: 0.00
              }
            },
            randomSeeds: [11, 22, 33],
            sampleCountPerCondition: 300,
            benchmarking: {
              sampleSizes: [100, 200, 400, 600],
              repetitionsPerSize: 5,
              dataset: "blobs",
              k: 3
            }
          },
          algorithms: {
            kmeans: {
              initialization: "K-Means++ (D^2 probability sampling)",
              heuristic: "Lloyd Iteration (Voronoi Partitioning)",
              maxIterations: 100,
              convergenceTolerance: 1e-5,
              emptyClusterStrategy: "Farthest point reseed"
            },
            mstClustering: {
              spanningTreeAlgorithm: "Prim's Dense Euclidean Minimum Spanning Tree",
              timeComplexity: "O(N^2)",
              spaceComplexity: "O(N)",
              partitioningStrategy: "Removal of (K - 1) longest Euclidean edges",
              componentExtraction: "Disjoint Set Union (Union-Find with path compression)",
              tieBreaking: "Deterministic by point and edge index"
            }
          },
          evaluationMetric: {
            primaryMetric: "Adjusted Rand Index (ARI) Hubert & Arabie (1985)",
            inlierEvaluation: "ARI computed exclusively over ground-truth inliers to prevent artificial cluster inflation from uniform outliers",
            baselineDegradationDelta: "Delta ARI = max(0, Baseline ARI - Perturbed ARI)"
          }
        }, null, 2);

        // 6. environment_information.json
        const environmentInfoJSON = JSON.stringify({
          softwareEnvironment: {
            runtime: "Client-Side JavaScript (Browser Native)",
            userAgent: envInfo.userAgent,
            platform: envInfo.platform,
            logicalCPUThreads: envInfo.logicalCores,
            timerAPI: "window.performance.now()",
            timerResolutionDescription: "High-resolution monotonic timer with anti-fingerprinting quantization (~5 to 100 microseconds depending on browser security flags)",
            browserQuantizationNote: "Execution runtimes under ~0.05 ms may legitimately register as 0.000 ms due to browser timer coarsening, which is treated as a valid non-negative runtime."
          },
          generationTimestamp: new Date().toISOString(),
          totalWallClockDurationMs: performance.now() - startTime
        }, null, 2);

        // Store in global object for automated retrieval
        window.__EVIDENCE_RESULTS__ = {
          robustnessTrialsCSV,
          robustnessSummaryCSV,
          benchmarkTrialsCSV,
          benchmarkSummaryCSV,
          experimentConfigJSON,
          environmentInfoJSON,
          figures: {
            blobsComparison: blobsPNGData,
            moonsComparison: moonsPNGData,
            circlesComparison: circlesPNGData,
            ariVsNoise: noisePNGData,
            ariVsOutliers: outliersPNGData,
            ariDegradation: degradationPNGData,
            runtimeScaling: scalingPNGData
          },
          metrics: {
            totalRobustnessTrials: allRobustnessTrials.length,
            totalBenchmarkTrials: benchmarkTrials.length,
            totalSummaryRows: robustnessSummaryRows.length,
            durationMs: performance.now() - startTime
          }
        };

        const totalSec = ((performance.now() - startTime) / 1000).toFixed(2);
        badgeElem.textContent = 'COMPLETED (100%)';
        badgeElem.style.color = '#10b981';
        btnStart.disabled = false;
        document.getElementById('btn-download-all').disabled = false;
        log(`\n✅ ALL EXPERIMENTS & FIGURES GENERATED IN ${totalSec}s! Evidence package ready in window.__EVIDENCE_RESULTS__.`);

        // Populate textareas for direct access
        document.getElementById('txt-robustness-trials').value = robustnessTrialsCSV;
        document.getElementById('txt-robustness-summary').value = robustnessSummaryCSV;
        document.getElementById('txt-benchmark-trials').value = benchmarkTrialsCSV;
        document.getElementById('txt-benchmark-summary').value = benchmarkSummaryCSV;
        document.getElementById('txt-config').value = experimentConfigJSON;
        document.getElementById('txt-env').value = environmentInfoJSON;
        document.getElementById('txt-blobs-b64').value = blobsPNGData;
        document.getElementById('txt-moons-b64').value = moonsPNGData;
        document.getElementById('txt-circles-b64').value = circlesPNGData;
        document.getElementById('txt-noise-b64').value = noisePNGData;
        document.getElementById('txt-outliers-b64').value = outliersPNGData;
        document.getElementById('txt-degradation-b64').value = degradationPNGData;
        document.getElementById('txt-scaling-b64').value = scalingPNGData;
      }

      function dataURLToBlob(dataURL) {
        const parts = dataURL.split(';base64,');
        const contentType = parts[0].split(':')[1];
        const raw = window.atob(parts[1]);
        const uInt8Array = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; ++i) {
          uInt8Array[i] = raw.charCodeAt(i);
        }
        return new Blob([uInt8Array], { type: contentType });
      }

      async function downloadAllArtifacts() {
        if (!window.__EVIDENCE_RESULTS__) {
          alert('Run evidence pipeline first!');
          return;
        }
        const res = window.__EVIDENCE_RESULTS__;
        const files = [
          { name: 'robustness_trials.csv', content: res.robustnessTrialsCSV, isText: true, mime: 'text/csv' },
          { name: 'robustness_summary.csv', content: res.robustnessSummaryCSV, isText: true, mime: 'text/csv' },
          { name: 'benchmark_trials.csv', content: res.benchmarkTrialsCSV, isText: true, mime: 'text/csv' },
          { name: 'benchmark_summary.csv', content: res.benchmarkSummaryCSV, isText: true, mime: 'text/csv' },
          { name: 'experiment_config.json', content: res.experimentConfigJSON, isText: true, mime: 'application/json' },
          { name: 'environment_information.json', content: res.environmentInfoJSON, isText: true, mime: 'application/json' },
          { name: 'blobs_comparison.png', content: res.figures.blobsComparison, isText: false },
          { name: 'moons_comparison.png', content: res.figures.moonsComparison, isText: false },
          { name: 'circles_comparison.png', content: res.figures.circlesComparison, isText: false },
          { name: 'ari_vs_noise.png', content: res.figures.ariVsNoise, isText: false },
          { name: 'ari_vs_outliers.png', content: res.figures.ariVsOutliers, isText: false },
          { name: 'ari_degradation.png', content: res.figures.ariDegradation, isText: false },
          { name: 'runtime_scaling.png', content: res.figures.runtimeScaling, isText: false }
        ];

        for (const f of files) {
          if (f.isText) {
            ExportManager.downloadText(f.content, f.name, f.mime);
          } else {
            const blob = dataURLToBlob(f.content);
            ExportManager.downloadBlob(blob, f.name);
          }
          await sleep(200);
        }
        log('All 13 evidence artifacts dispatched for download to Downloads folder.');
      }

      btnStart.addEventListener('click', runEvidencePipeline);
      document.getElementById('btn-download-all').addEventListener('click', downloadAllArtifacts);
      window.runEvidencePipeline = runEvidencePipeline;
      window.downloadAllArtifacts = downloadAllArtifacts;
    })();
  </script>
